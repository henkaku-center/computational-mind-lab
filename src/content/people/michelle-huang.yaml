blurbJa: ミシェルは、ケアのアーキテクチャをデザインするアーティスト・リサーチャーである。彼女は、日本の地方にある空き家(akiya)をインスタレーション、レジデンス、研究拠点へと再生する501(c)(3)の非営利ソーシャルR&Dラボ、Akiya Collectiveを設立した。また、Chiba Institute of Technologyの客員研究員(Visiting Researcher)を務めるほか、社会的オブジェクトを通じた協力に関する全国規模の参加型研究の共同研究代表者(co-PI)も務めている。彼女と当ラボは、物がどのように見知らぬ人々を協力の連鎖へと引き込むかを追跡する全国規模のフィールドスタディ、[Kaeru-chan](/en/projects/kaeru-chan/)で共同研究を行っている。その研究活動はEmergent Ventures、O'Shaughnessy Ventures、US-Japan Foundationから支援を受けており、NPR、BBC、Business Insider、ABC、CNET、The Independentで取り上げられている。
